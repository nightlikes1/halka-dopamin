name: halka-dopamin

services:
  # -------------------------------------------------------------
  # Fastify API Sunucusu (Supabase PostgreSQL bağlantılı)
  # -------------------------------------------------------------
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: halka-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # -------------------------------------------------------------
  # Halka Web Arayüzü (Nginx üzerinde Expo SPA)
  # -------------------------------------------------------------
  web:
    build:
      context: ./halka-mobile
      dockerfile: Dockerfile
      args:
        - EXPO_PUBLIC_API_URL=http://localhost:3000
    container_name: halka-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy

networks:
  default:
    name: halka-network
