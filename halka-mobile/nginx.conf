server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Sürüm numarası yanıtlarda görünmesin
    server_tokens off;

    # Güvenlik başlıkları. Bir location kendi add_header satırını yazarsa nginx bunların hepsini
    # o location için iptal eder: location içinde add_header kullanma.
    # style-src 'unsafe-inline': react-native-web stilleri çalışma anında ekler.
    # connect-src localhost:3000: yerel docker-compose'da API ayrı adreste.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self' http://localhost:3000; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Şifre sıfırlama bağlantısındaki token başka sitelere sızmasın
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Gzip sıkıştırma
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # Statik varlıklar (JS, CSS, Fontlar, Sesler) için önbellekleme
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|wav|mp3)$ {
        expires 6M;
        access_log off;
        try_files $uri =404;
    }

    # SPA Yönlendirmesi (Single Page Application fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
