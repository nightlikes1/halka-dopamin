name: halka-production

# -------------------------------------------------------------
# Canlı Ortam Yapılandırması (GHCR İmajları + Cloudflare Zero Trust)
# Bu dosyada DERLEME (build) YAPILMAZ.
# GitHub Actions'ın derleyip GHCR'a attığı hazır imajlar saniyeler içinde çekilir.
# Sunucunuzda 0 CPU derleme yükü oluşur.
# -------------------------------------------------------------

services:
  # -----------------------------------------------------------
  # Fastify API Sunucusu
  # -----------------------------------------------------------
  server:
    image: ghcr.io/${GHCR_REPO:-nightlikes1/halka-dopamin}/server:latest
    container_name: halka-server-prod
    restart: unless-stopped
    ports:
      # Sadece 127.0.0.1'e bağlar. Dış dünyadan doğrudan erişilemez;
      # yalnızca Cloudflare Zero Trust tüneli erişebilir.
      - "127.0.0.1:3000:3000"
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # -----------------------------------------------------------
  # Halka Web Arayüzü (Nginx üzerinde derlenmiş Expo SPA)
  # -----------------------------------------------------------
  web:
    image: ghcr.io/${GHCR_REPO:-nightlikes1/halka-dopamin}/web:latest
    container_name: halka-web-prod
    restart: unless-stopped
    ports:
      # Sadece 127.0.0.1'e bağlar. Dış dünyaya kapalıdır.
      - "127.0.0.1:8080:80"
    depends_on:
      server:
        condition: service_healthy

  # -----------------------------------------------------------
  # Otomatik Canlıya Alma (Continuous Deployment - Watchtower)
  # GitHub Actions yeni bir imaj yüklediğinde sunucuyu otomatik günceller.
  # Sunucunuzda derleme YAPMAZ, sadece hazır imajı çekip 3 saniyede yeniler.
  # -----------------------------------------------------------
  watchtower:
    image: containrrr/watchtower:latest
    container_name: halka-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # GHCR yetkilendirmesi için (private depolar için):
      - ~/.docker/config.json:/config.json:ro
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=60 # Her 60 saniyede bir yeni sürüm kontrol edilir
      - WATCHTOWER_INCLUDE_RESTARTING=true

networks:
  default:
    name: halka-prod-network
