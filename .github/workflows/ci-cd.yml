name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # -------------------------------------------------------------
  # AŞAMA 1: Test ve Doğrulama (CI)
  # Testlerden biri dahi geçmezse süreç durur, imaj derlenmez.
  # -------------------------------------------------------------
  validate:
    name: Test & Validate
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
      JWT_SECRET: "test-jwt-secret-en-az-32-karakter-uzunlugunda-bir-anahtar"
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Node.js 22 Kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            halka-mobile/package-lock.json

      # --- Server Testleri ---
      - name: Server Bağımlılıklarını Kur (Temiz)
        run: |
          cd server
          npm ci

      - name: Server Doğrulama (Tip Kontrolü, Lint, Vitest, Build)
        run: |
          cd server
          npm run validate

      # --- Mobil / Web Testleri ---
      - name: Mobil Bağımlılıklarını Kur (Temiz)
        run: |
          cd halka-mobile
          npm ci

      - name: Mobil Doğrulama (Tip Kontrolü, Lint, Jest)
        run: |
          cd halka-mobile
          npm run validate

  # -------------------------------------------------------------
  # AŞAMA 2: Docker İmajlarını Derle ve GHCR'a Gönder (CD)
  # Yalnızca testler başarılı olduğunda ve main dalında çalışır.
  # Derleme GitHub'ın güçlü sunucularında yapılır, kendi sunucunuzda 0 CPU harcanır.
  # -------------------------------------------------------------
  build-and-push:
    name: Build & Push to GHCR
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Depo Adını Küçük Harfe Çevir (GHCR zorunluluğu)
        id: repo_name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Docker Buildx Kur
        uses: docker/setup-buildx-action@v3

      - name: GitHub Container Registry'ye Giriş Yap
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- 1) API Server İmajını Derle ve Yükle ---
      - name: Server İmajını Derle ve GHCR'a Bas
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_name.outputs.REPO }}/server:latest
            ghcr.io/${{ steps.repo_name.outputs.REPO }}/server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- 2) Web Arayüzü İmajını Derle ve Yükle ---
      - name: Web İmajını Derle ve GHCR'a Bas
        uses: docker/build-push-action@v6
        with:
          context: ./halka-mobile
          file: ./halka-mobile/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_name.outputs.REPO }}/web:latest
            ghcr.io/${{ steps.repo_name.outputs.REPO }}/web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
