# ============================================================
# Sunucu Nginx Yapılandırması — Halka (halka.aegis.net.tr)
# Bu dosya bilgi amaçlıdır; sunucunuza kopyalanacaktır.
# ============================================================

# 1) Web Arayüzü: halka.aegis.net.tr → Docker Web Konteyneri (port 3100)
# (Bu yapılandırma zaten mevcut Nginx'inizde var)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name halka.aegis.net.tr;
    add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;

    ssl_certificate /etc/letsencrypt/live/halka.aegis.net.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/halka.aegis.net.tr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2) API Sunucusu: api.halka.aegis.net.tr → Docker API Konteyneri (port 3000)
# Certbot ile SSL sertifikası: sudo certbot --nginx -d api.halka.aegis.net.tr
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.halka.aegis.net.tr;
    add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;

    ssl_certificate /etc/letsencrypt/live/api.halka.aegis.net.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.halka.aegis.net.tr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
